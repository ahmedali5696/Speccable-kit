name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Windows: bundled PowerShell 5.1 + Node + the `specify` CLI (a native binary).
  # Runs the full contract suite (including the native-install test) and the clean-room
  # evidence harness against the shipped extension/ source of truth.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PyYAML (optional dev dep)
        run: python -m pip install PyYAML

      - name: Confirm runtime availability
        run: |
          python --version
          node --version
          powershell -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"
          specify --version

      - name: Run contract suite (PowerShell 5.1 + Node validator + native install)
        run: python -m unittest tests.test_contract -v

      - name: Run clean-room evidence harness
        run: python tests/run_cleanroom.py

  # Linux: PowerShell Core (pwsh) + Node. Exercises the .ps1 scripts under pwsh and the
  # Node validator. The native-install and clean-room tests that require the `specify` CLI
  # (a Windows-native binary) are skipped here, so this job verifies the PowerShell-script +
  # validator contract on a non-Windows host without claiming `specify` availability.
  linux-ps-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PowerShell Core (pwsh)
        shell: bash
        run: |
          set -e
          sudo apt-get update
          # Install via the official Microsoft repo for a stable, symlinked /usr/bin/pwsh.
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install PyYAML (optional dev dep)
        run: python -m pip install PyYAML

      - name: Confirm runtimes
        run: |
          python --version
          node --version
          pwsh -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Run contract suite (PowerShell Core pwsh + Node validator)
        run: python -m unittest tests.test_contract -v
